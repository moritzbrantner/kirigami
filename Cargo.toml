[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
earcut = "0.4.11"
wasm-bindgen = "0.2"
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "419333a7ecedc94a99bfc6b940fbdbcfc7bec958", package = "three-d-core" }
