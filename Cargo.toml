[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-export",
    "crates/kirigami-targets",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
earcut = "=0.4.12"
wasm-bindgen = "=0.2.130"
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "eb807d2b8a4cc91098b9a77b82dbc612467d23c1" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "eb807d2b8a4cc91098b9a77b82dbc612467d23c1" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "eb807d2b8a4cc91098b9a77b82dbc612467d23c1" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "30dc4371666a8c20ae623c6925a39d6a86b7ab2b", package = "three-d-animation" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "30dc4371666a8c20ae623c6925a39d6a86b7ab2b", package = "three-d-assets" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "30dc4371666a8c20ae623c6925a39d6a86b7ab2b", package = "three-d-core" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "30dc4371666a8c20ae623c6925a39d6a86b7ab2b", package = "three-d-formats" }
