[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-export",
    "crates/kirigami-targets",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
earcut = "=0.4.11"
wasm-bindgen = "=0.2.129"
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "5a3fab06da3c41fa522ebcfa7234457523ccda18" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "5a3fab06da3c41fa522ebcfa7234457523ccda18" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "5a3fab06da3c41fa522ebcfa7234457523ccda18" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "c850bda5f37f65f79655469625baf5f1644ac2a0", package = "three-d-animation" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "c850bda5f37f65f79655469625baf5f1644ac2a0", package = "three-d-assets" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "c850bda5f37f65f79655469625baf5f1644ac2a0", package = "three-d-core" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "c850bda5f37f65f79655469625baf5f1644ac2a0", package = "three-d-formats" }
