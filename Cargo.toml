[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-export",
    "crates/kirigami-targets",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
earcut = "=0.4.12"
wasm-bindgen = "=0.2.130"
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "7c4cc7c9e1c432969a28304db39f8b11e08f8129" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "7c4cc7c9e1c432969a28304db39f8b11e08f8129" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "7c4cc7c9e1c432969a28304db39f8b11e08f8129" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "357b9bd8fc0bd7efaf9df4c75daab683a888f53c", package = "three-d-animation" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "357b9bd8fc0bd7efaf9df4c75daab683a888f53c", package = "three-d-assets" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "357b9bd8fc0bd7efaf9df4c75daab683a888f53c", package = "three-d-core" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "357b9bd8fc0bd7efaf9df4c75daab683a888f53c", package = "three-d-formats" }
