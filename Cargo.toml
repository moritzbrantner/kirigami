[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-export",
    "crates/kirigami-targets",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
earcut = "=0.4.11"
wasm-bindgen = "=0.2.129"
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "19b30ea604acbbb72b106b697cbcd5aa8764b99b" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "19b30ea604acbbb72b106b697cbcd5aa8764b99b" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "19b30ea604acbbb72b106b697cbcd5aa8764b99b" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "5340bdf31de6761ed16737dd6d19da2431172fd6", package = "three-d-animation" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "a39a673e319299c6186d07b1ced5644587b17509", package = "three-d-assets" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "5340bdf31de6761ed16737dd6d19da2431172fd6", package = "three-d-core" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "5340bdf31de6761ed16737dd6d19da2431172fd6", package = "three-d-formats" }
