[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-export",
    "crates/kirigami-targets",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
earcut = "=0.4.12"
wasm-bindgen = "=0.2.130"
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "2082c4e64afaf2af605fbcf28e554a51fc1c9fe3" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "2082c4e64afaf2af605fbcf28e554a51fc1c9fe3" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "2082c4e64afaf2af605fbcf28e554a51fc1c9fe3" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "5926fe6a87ca882c637fdd8729624730d0b4b9fd", package = "three-d-animation" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "5926fe6a87ca882c637fdd8729624730d0b4b9fd", package = "three-d-assets" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "5926fe6a87ca882c637fdd8729624730d0b4b9fd", package = "three-d-core" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "5926fe6a87ca882c637fdd8729624730d0b4b9fd", package = "three-d-formats" }
