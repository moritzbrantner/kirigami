[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-export",
    "crates/kirigami-targets",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
earcut = "=0.4.11"
wasm-bindgen = "=0.2.130"
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "1c91cf204effc8eeaddf0fc73c130ce2dd643891" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "1c91cf204effc8eeaddf0fc73c130ce2dd643891" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "1c91cf204effc8eeaddf0fc73c130ce2dd643891" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "8fa2b4f3057d3479ee8166f34d83705e283012cd", package = "three-d-animation" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "8fa2b4f3057d3479ee8166f34d83705e283012cd", package = "three-d-assets" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "8fa2b4f3057d3479ee8166f34d83705e283012cd", package = "three-d-core" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "8fa2b4f3057d3479ee8166f34d83705e283012cd", package = "three-d-formats" }
