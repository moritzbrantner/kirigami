[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-export",
    "crates/kirigami-targets",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
earcut = "=0.4.11"
wasm-bindgen = "=0.2.129"
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "61a218d873893aa2dbc6fe9b4f1b32ecb2e078ae" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "61a218d873893aa2dbc6fe9b4f1b32ecb2e078ae" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "61a218d873893aa2dbc6fe9b4f1b32ecb2e078ae" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "bfeb9fafd8fef541e51236bf76b5b57ab73213d4", package = "three-d-animation" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "bfeb9fafd8fef541e51236bf76b5b57ab73213d4", package = "three-d-assets" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "bfeb9fafd8fef541e51236bf76b5b57ab73213d4", package = "three-d-core" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "bfeb9fafd8fef541e51236bf76b5b57ab73213d4", package = "three-d-formats" }
