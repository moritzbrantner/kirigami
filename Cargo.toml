[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-export",
    "crates/kirigami-targets",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
earcut = "=0.4.11"
wasm-bindgen = "=0.2.130"
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "41a5ac8364d4acdfcd1cb4849a802c841f32ae7b" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "41a5ac8364d4acdfcd1cb4849a802c841f32ae7b" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "41a5ac8364d4acdfcd1cb4849a802c841f32ae7b" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "6bd382d81687a33633e927f69258726f0b85c296", package = "three-d-animation" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "6bd382d81687a33633e927f69258726f0b85c296", package = "three-d-assets" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "6bd382d81687a33633e927f69258726f0b85c296", package = "three-d-core" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "6bd382d81687a33633e927f69258726f0b85c296", package = "three-d-formats" }
