[workspace]
members = [
    "crates/kirigami-core",
    "crates/kirigami-export",
    "crates/kirigami-targets",
    "crates/kirigami-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
earcut = "=0.4.12"
wasm-bindgen = "=0.2.130"
bvh-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "291ae802a2a264d0a3bc5a482f1b3a13bcf86b51" }
geometry-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "291ae802a2a264d0a3bc5a482f1b3a13bcf86b51" }
spatial-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "291ae802a2a264d0a3bc5a482f1b3a13bcf86b51" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab", rev = "edfa62fe747e6bacc59be634259d1fdd2640fb35", package = "three-d-animation" }
three-d-assets = { git = "https://github.com/moritzbrantner/3d-lab", rev = "edfa62fe747e6bacc59be634259d1fdd2640fb35", package = "three-d-assets" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab", rev = "edfa62fe747e6bacc59be634259d1fdd2640fb35", package = "three-d-core" }
three-d-formats = { git = "https://github.com/moritzbrantner/3d-lab", rev = "edfa62fe747e6bacc59be634259d1fdd2640fb35", package = "three-d-formats" }
