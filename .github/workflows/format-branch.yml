name: Format branch

on:
  push:
    branches: [feat/half-edge-topology]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/half-edge-topology
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit exact rustfmt output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/kirigami-core/src/lib.rs crates/kirigami-core/src/topology.rs
          git commit -m "Apply rustfmt"
          git push origin HEAD:feat/half-edge-topology
