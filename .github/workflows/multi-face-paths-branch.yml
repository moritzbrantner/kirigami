name: Build multi-face path slice

on:
  push:
    branches:
      - feat/multi-face-cut-paths

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/multi-face-cut-paths
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply slice
        run: python3 scripts/add_multi_face_paths.py
      - name: Normalize path slicing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/kirigami-core/src/topology.rs")
          text = path.read_text()
          old = '''        if position > start.position + PATH_POSITION_TOLERANCE
            && position < end.position - PATH_POSITION_TOLERANCE
        {
            if !approximately_equal(*fragment.last().expect("fragment has start"), point) {
                fragment.push(point);
            }
        }'''
          new = '''        if position > start.position + PATH_POSITION_TOLERANCE
            && position < end.position - PATH_POSITION_TOLERANCE
            && !approximately_equal(*fragment.last().expect("fragment has start"), point)
        {
            fragment.push(point);
        }'''
          if old not in text and new not in text:
              raise SystemExit("path slicing pattern not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: WASM
        run: cargo build -p kirigami-wasm --target wasm32-unknown-unknown --release
      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/kirigami-core/src/lib.rs crates/kirigami-core/src/topology.rs ROADMAP.md
          git commit -m "Add multi-face path arrangement"
          git push origin HEAD:feat/multi-face-cut-paths
