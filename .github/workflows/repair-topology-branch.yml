name: Repair topology branch

on:
  push:
    branches:
      - feat/half-edge-topology

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/half-edge-topology
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply reviewed geometry fixes
        run: python3 scripts/repair_topology.py
      - name: Format
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/kirigami-core/src/topology.rs
          git commit -m "Make topology predicates scale-aware"
          git push origin HEAD:feat/half-edge-topology
